# Am 03.09.2026 zugunsten von Plesks eigenem Git-Deploy entfernt, am 21.09.2026
# wieder aufgenommen: Der Plesk-Pull hatte aufgehoert zu ziehen (der Datums-Fix
# vom 06.09. lag committet in main und war trotzdem nicht live).
#
# Diese Action authentifiziert sich ueber FTP-Secrets, nicht ueber einen
# persoenlichen GitHub-Token — sie laeuft also auch dann, wenn der Token
# abgelaufen ist.
#
# Braucht drei Repository-Secrets: FTP_SERVER, FTP_USERNAME, FTP_PASSWORD.
# Ohne die bricht der Lauf mit "Input required and not supplied: server" ab.

name: Deploy preview to Netcup

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  ftp-deploy:
    name: FTP deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          # FTPS statt FTP — sonst gehen Zugangsdaten unverschlüsselt über die Leitung
          protocol: ftps
          local-dir: ./
          # Plesk: das Web-Root ist httpdocs, nicht das FTP-Wurzelverzeichnis
          server-dir: ./httpdocs/
          # Nur wirklich Aenderungen uebertragen, nicht jedes Mal alles
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            **/Idea/**
            **/README.md
            **/.DS_Store
