name: Deploy preview to Netcup

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  ftp-deploy:
    name: FTP deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          # FTPS statt FTP — sonst gehen Zugangsdaten unverschlüsselt über die Leitung
          protocol: ftps
          local-dir: ./
          # Plesk: das Web-Root ist httpdocs, nicht das FTP-Wurzelverzeichnis
          server-dir: ./httpdocs/
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            **/Idea/**
            **/README.md
